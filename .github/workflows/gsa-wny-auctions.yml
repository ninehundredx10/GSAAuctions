name: GSA WNY Auctions

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gsa-wny-auctions
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Save raw API response to a file
        env:
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
        run: |
          mkdir -p data
          python3 -c "
          import os, urllib.request
          req = urllib.request.Request('https://api.gsa.gov/assets/gsaauctions/v2/auctions?format=json', headers={'X-API-KEY': os.environ['GSA_API_KEY'], 'Accept': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as resp:
              body = resp.read()
          open('data/gsa_raw_debug.json', 'wb').write(body)
          "

      - name: Fetch GSA WNY listings
        env:
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
        run: |
          mkdir -p data
          python3 gsa_wny_auctions.py --csv data/gsa_wny_latest.csv
          python3 gsa_wny_auctions.py > data/gsa_wny_latest.txt

      - name: Commit results
        run: |
          git config user.name "gsa-wny-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add data/gsa_wny_latest.csv data/gsa_wny_latest.txt data/gsa_raw_debug.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly GSA WNY auctions refresh"
            git push
          fi
